<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 부의 공식 - 수익율의 함정</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

body {
    font-family: 'Inter', sans-serif;
    background-color: #f7f9fc;
    margin: 0;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}
h1 { color: #111827; margin-bottom: 5px; font-size: 1.8rem; text-align: center; }
p { color: #6b7280; margin-top: 0; margin-bottom: 15px; font-size: 0.95rem; text-align: center; }

.container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 1000px;
    align-items: center;
}

/* 카드 스타일 */
.card {
    background: #ffffff;
    border-radius: 1.5rem; /* rounded-3xl */
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    padding: 20px;
    width: 95%;
    max-width: 450px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    transition: transform 0.2s;
}
.card:hover { transform: translateY(-2px); }

/* 입력 행 */
.input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    overflow-x: auto;
}
input[type="number"], input[type="color"] {
    padding: 6px 10px;
    border-radius: 0.75rem; /* rounded-xl */
    border: 1px solid #d1d5db;
    text-align: right;
    font-size: 0.95rem;
    background-color: #fff;
}
input[type="color"] { width: 45px; padding: 0; }

/* 버튼 */
button {
    background-color: #10b981;
    border: none;
    border-radius: 1rem;
    padding: 10px 18px;
    font-size: 1rem;
    cursor: pointer;
    color: white;
    font-weight: 600;
    transition: 0.2s;
}
button:hover { background-color: #059669; }
button:active { transform: scale(0.97); }

/* 시나리오 카드 */
.scenario {
    background: #ffffff;
    border-radius: 1.5rem;
    padding: 15px;
    margin-bottom: 15px;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

/* Canvas 차트 */
canvas {
    background-color: #ffffff;
    border-radius: 1.5rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    margin-top: 20px;
    width: 100%;
    max-width: 800px;
}

/* 컨트롤 버튼 그룹 */
.control-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 15px;
    align-items: center;
}

/* 단위 선택 라디오 버튼 */
.mode-selector {
    display: flex;
    justify-content: center;
    gap: 10px;
    align-items: center;
    margin-top: 5px;
    width: 100%;
    flex-wrap: wrap;
}

/* 반응형 */
@media (max-width: 640px) {
    h1 { font-size: 1.5rem; }
    .card { max-width: 95%; padding: 15px; }
    input[type="number"] { width: 80px; }
    canvas { max-width: 95%; }
}
</style>
</head>
<body>

<h1>💰 부의 공식 - 수익율의 함정</h1>
<p>홀수년과 짝수년의 수익률(%) 또는 수익비(배)를 비교해보세요.</p>

<div class="control-buttons">
  <label>초기 금액:
    <input type="number" id="initialAmount" value="10000" min="10"> 원
  </label>
  <label>투자기간:
    <input type="number" id="totalYears" value="10" min="1" max="50"> 년
  </label>

  <div class="mode-selector">
    단위:
    <label><input type="radio" name="rateMode" value="percent" checked> 수익률(%)</label>
    <label><input type="radio" name="rateMode" value="ratio"> 수익비(배)</label>
  </div>
</div>

<div id="scenariosContainer"></div>
<div style="margin-top:10px; text-align:center;">
  <button onclick="drawChart()">🔍 조회하기</button>
</div>

<canvas id="compoundChart" width="800" height="400"></canvas>

<script>
let scenarioCount = 0;
let rateMode = "ratio"; // 현재 선택된 단위

const colors = ["#e53935", "#fdd835", "#43a047", "#1e88e5"];

function getInitialScenarios(mode) {
  if (mode === "percent") {
    return [
      [10, 10],
      [30, -10],
      [-10, 30],
      [20, 0]
    ];
  } else {
    // ✅ % → 배율 변환 (1 + n/100)
    return [
      [1.1, 1.1],
      [1.3, 0.9],
      [0.9, 1.3],
      [1.2, 1.0]
    ];
  }
}

function addScenario(rates = [], color = "#00796b") {
  scenarioCount++;
  const container = document.getElementById('scenariosContainer');
  const div = document.createElement('div');
  div.className = 'scenario';
  div.id = 'scenario-' + scenarioCount;

  let html = `<div class="scenario-header"><strong>${scenarioCount}안</strong></div>`;
  html += `<div class="input-row"><input type="color" id="scenario-${scenarioCount}-color" value="${color}"></div>`;
  html += `<div class="input-row">`;
  html += `<label>홀수년차: <input type="number" value="${rates[0]}" id="scenario-${scenarioCount}-odd" step="0.01"> </label>`;
  html += `<label>짝수년차: <input type="number" value="${rates[1]}" id="scenario-${scenarioCount}-even" step="0.01"> </label>`;
  html += `</div>`;

  div.innerHTML = html;
  container.appendChild(div);
}

function renderScenarios() {
  document.getElementById('scenariosContainer').innerHTML = '';
  scenarioCount = 0;
  const scenarios = getInitialScenarios(rateMode);
  scenarios.forEach((rates, i) => addScenario(rates, colors[i]));
}

function drawChart() {
  const initialAmount = parseFloat(document.getElementById('initialAmount').value);
  const totalYears = parseInt(document.getElementById('totalYears').value);
  const scenarioDivs = document.querySelectorAll('.scenario');
  const labels = [];
  const datasets = [];

  for (let i = 1; i <= totalYears; i++) {
    labels.push(i + '년차');
  }

  scenarioDivs.forEach((div, idx) => {
    const oddValue = parseFloat(div.querySelector(`#scenario-${idx+1}-odd`).value);
    const evenValue = parseFloat(div.querySelector(`#scenario-${idx+1}-even`).value);
    const color = div.querySelector('input[type=color]').value;

    // ✅ 단위별 변환
    const oddMultiplier = (rateMode === "percent") ? (1 + oddValue / 100) : oddValue;
    const evenMultiplier = (rateMode === "percent") ? (1 + evenValue / 100) : evenValue;

    let amount = initialAmount;
    const data = [amount];

    for (let year = 1; year <= totalYears; year++) {
      const mult = (year % 2 === 1) ? oddMultiplier : evenMultiplier;
      amount *= mult;
      data.push(parseFloat(amount.toFixed(2)));
    }

    datasets.push({
      label: div.querySelector('strong').innerText,
      data,
      borderColor: color,
      fill: false,
      tension: 0.3
    });
  });

  const ctx = document.getElementById('compoundChart').getContext('2d');
  if (window.myChart) window.myChart.destroy();

  window.myChart = new Chart(ctx, {
    type: 'line',
    data: { labels: ['0년차', ...labels], datasets },
    options: {
      responsive: false,
      plugins: { legend: { position: 'bottom' } },
      scales: {
        y: { title: { display: true, text: '금액 (원)' } },
        x: { title: { display: true, text: '연도' } }
      }
    }
  });
}

// ✅ 라디오 버튼 변경 시 기본값 변경
document.querySelectorAll('input[name="rateMode"]').forEach(r => {
  r.addEventListener('change', e => {
    rateMode = e.target.value;
    renderScenarios();
  });
});

// 초기 시나리오 표시
renderScenarios();
</script>
</body>
</html>
