<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🌱 영재교육 - 돈나무 시뮬레이터</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#f6fbf6;--card:#ffffff;--accent:#27ae60;--muted:#6b7280}
    *{box-sizing:border-box}
    body{font-family:'Noto Sans KR','Arial',sans-serif;margin:0;background:linear-gradient(180deg,#f0fbf4,#f6fbfef);color:#0f172a}
    header{background:var(--accent);color:white;padding:18px 16px;display:flex;gap:12px;align-items:center}
    header h1{font-size:18px;margin:0}
    .container{max-width:1100px;margin:20px auto;padding:16px}
    .card{background:var(--card);border-radius:14px;box-shadow:0 6px 18px rgba(15,23,42,0.06);padding:16px;margin-bottom:16px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .col{flex:1}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input[type=number],select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e6eef0;font-size:15px}
    .controls{display:flex;gap:8px;flex-wrap:wrap}
    button{background:var(--accent);color:white;border:0;padding:10px 12px;border-radius:10px;font-weight:600;cursor:pointer}
    button.ghost{background:transparent;color:var(--accent);border:2px solid rgba(39,174,96,0.12)}
    .years-grid{display:grid;grid-template-columns:repeat(1,1fr);gap:12px}
    .year-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .small{width:84px}
    .xsmall{width:64px}
    .muted{color:var(--muted);font-size:13px}
    .hint{font-size:13px;color:var(--muted);margin-top:8px}
    .chart-wrap{height:360px;width:100%;}
    @media(min-width:720px){.years-grid{grid-template-columns:repeat(2,1fr)}header h1{font-size:20px}}
    @media(min-width:1000px){.years-grid{grid-template-columns:repeat(3,1fr)}}
    footer{font-size:13px;color:var(--muted);text-align:center;padding:12px}
  </style>
</head>
<body>
  <header>
    <div style="font-size:28px">🌱</div>
    <div>
      <h1>📈 돈나무 시뮬레이터</h1>
      <div class="muted">매년 투자 방법과 수익률 또는 수익비를 직접 정해서 결과를 확인해요.</div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="row" style="gap:16px;align-items:end">
        <div class="col">
          <label>시드 머니 (원)</label>
          <input id="seed" type="number" min="0" value="100000" />
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;">
          <div style="width:80px">
            <label>투자 기간</label>
            <input id="years" type="number" min="1" max="240" value="5" />
          </div>
          <div style="width:80px">
            <label>&nbsp;</label>
            <select id="periodUnit">
              <option value="year">년</option>
              <option value="month">월</option>
            </select>
          </div>
          <div style="width:120px">
            <label>수익 단위</label>
            <select id="unitType">
              <option value="percent">%</option>
              <option value="multiple">배</option>
            </select>
          </div>
          <div style="width:100px">
            <label>&nbsp;</label>
            <button id="generate">적용</button>
          </div>
        </div>
      </div>
      <div class="hint">계산 방식: 매년 "추가 투자금"을 더한 후 수익률을 적용합니다.</div>
    </section>

    <section class="card">
      <strong id="periodLabel">연별 설정</strong>
      <div id="yearsGrid" class="years-grid" style="margin-top:12px"></div>
    </section>

    <section class="card">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button id="calc">조회하기</button>
        <button id="reset" class="ghost">초기화</button>
        <div class="muted">총액은 매년 말 기준으로 표시됩니다.</div>
      </div>

      <div style="margin-top:14px">
        <div class="chart-wrap card" style="padding:12px;">
          <canvas id="resultChart" ></canvas>
        </div>
        <div style="margin-top:10px" id="summary" class="muted"></div>
      </div>
    </section>
    <footer class="muted">설명: 수익률(%) 예) 5 = 5% 수익, 또는 수익비(배) 예) 1.05 = 5% 수익.</footer>
  </main>

  <script>
    const yearsGrid=document.getElementById('yearsGrid');
    const yearsInput=document.getElementById('years');
    const seedInput=document.getElementById('seed');
    const generateBtn=document.getElementById('generate');
    const calcBtn=document.getElementById('calc');
    const resetBtn=document.getElementById('reset');
    const unitType=document.getElementById('unitType');
    const periodUnit=document.getElementById('periodUnit');
    const periodLabel=document.getElementById('periodLabel');
    let chart=null;

    const presets={deposit:{type:'예금',rate:3},installment:{type:'적금',rate:6},bond:{type:'채권',rate:8},stock:{type:'주식',rate:20}};

    function createYearRow(i){
      const unit = periodUnit.value === 'year' ? '년 차' : '개월 차';
      const div=document.createElement('div');
      div.className='card year-row';
      div.innerHTML=`
        <div style="flex:1;min-width:120px">
          <label>${i}${unit}</label>
          <select class="invest-type">
            <option value="deposit">예금</option>
            <option value="installment">적금</option>
            <option value="bond">채권</option>
            <option value="stock">주식</option>
            <option value="gold">금</option>
          </select>
        </div>
        <div class="small">
          <label class="rate-label">수익률(%)</label>
          <input class="rate" type="number" step="0.01" min="0" value="5" />
        </div>
        <div class="xsmall">
          <label>추가투자금</label>
          <input class="add" type="number" min="0" value="0" />
        </div>
      `;
      return div;
    }

    function updatePeriodLabel(){
      periodLabel.textContent = periodUnit.value==='year' ? '연별 설정' : '월별 설정';
    }

    function generateRows(){
    let n = parseInt(yearsInput.value)||1;
    if(periodUnit.value==='month'){ 
        // n = Math.ceil(n/12);  기존 코드 삭제
    }
    n = Math.max(1,Math.min(240,n)); // 월 단위 최대 240개월까지 허용
    yearsGrid.innerHTML='';
    updatePeriodLabel();
    for(let i=1;i<=n;i++){
        yearsGrid.appendChild(createYearRow(i));
    }
    }


    function updateRateLabels(){
      const rows=document.querySelectorAll('.year-row');
      rows.forEach(r=>{
        const label=r.querySelector('.rate-label');
        label.textContent=unitType.value==='percent'? '수익률(%)':'수익비(배)';
      });
    }

    function convertExistingRates(){
      const rows=document.querySelectorAll('.year-row');
      rows.forEach(r=>{
        const input=r.querySelector('.rate');
        let val=parseFloat(input.value)||0;
        if(unitType.value==='multiple'){ input.value=(1+(val/100)).toFixed(3); }
        else { input.value=((val-1)*100).toFixed(2); }
      });
    }

    unitType.addEventListener('change',()=>{
      convertExistingRates();
      updateRateLabels();
    });

    periodUnit.addEventListener('change',()=>{
      generateRows(); // 단위 변경 시 레이블과 행 업데이트
    });

    generateBtn.addEventListener('click',()=>{
      generateRows();
      updateRateLabels();
    });

calcBtn.addEventListener('click', () => {
  const seed = Math.max(0, Number(seedInput.value) || 0);
  const rows = Array.from(yearsGrid.children);
  if (rows.length === 0) {
    alert('연별 설정을 먼저 생성해주세요.');
    return;
  }

  let total = seed;
  const labels = [];
  const data = [];

  // ✅ 0년차 먼저 푸시
  const unit = periodUnit.value === 'year' ? '년 차' : '개월 차';
  labels.push('0' + unit);
  data.push(Math.round(total));

  // ✅ 1년차부터 계산 시작
  rows.forEach((r, idx) => {
    const val = Number(r.querySelector('.rate').value) || 0;
    const rate = (unitType.value === 'percent') ? (1 + val / 100) : val;
    const add = Math.max(0, Number(r.querySelector('.add').value) || 0);
    total = (total + add) * rate;
    labels.push((idx + 1) + unit);
    data.push(Math.round(total));
  });

  const ctx = document.getElementById('resultChart').getContext('2d');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '총액(원)',
        data,
        fill: true,
        tension: 0.25
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            callback: v => v.toLocaleString()
          }
        }
      }
    }
  });

  document.getElementById('summary').innerHTML = `최종 총액: ${data[data.length - 1].toLocaleString()}원`;
});

    generateRows();
  </script>
</body>
</html>
