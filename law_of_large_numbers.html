<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동전던지기 시뮬레이션</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
        }
        .card {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .flip-button {
            transition: background-color 0.15s ease-in-out, transform 0.1s;
        }
        .flip-button:active {
            transform: scale(0.98);
        }
        .indicator {
            height: 10px;
            border-radius: 9999px;
            transition: width 0.3s ease-out;
        }
        #chartCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 1.5rem;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        #coin {
            cursor: pointer;
            perspective: 1000px;
            transition: transform 0.05s ease-out;
            will-change: transform;
        }
        @keyframes flipCoin {
            0% { transform: rotateY(0deg) scale(1); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
            50% { transform: rotateY(540deg) scale(1.2) translateY(-20px); box-shadow: 0 30px 40px rgba(0,0,0,0.4); }
            100% { transform: rotateY(1080deg) scale(1); box-shadow: 0 10px 20px rgba(0,0,0,0.2); } 
        }
        .coin-heads { background-color: #fcd34d; }
        .coin-tails { background-color: #d1d5db; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-start justify-center">
    <div class="w-full max-w-4xl space-y-8">
        <header class="text-center">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2">💰 동전던지기 시뮬레이션</h1>
            <p class="text-gray-500">앞면 확률을 조정하고 속도를 설정하여 수렴 과정을 관찰해보세요.</p>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="card bg-white p-6 rounded-3xl space-y-4">
                    <h2 class="text-2xl font-semibold text-gray-700">동전 던지기</h2>
                    <div class="pt-2">
                        <label for="probabilitySlider" class="block text-lg font-medium text-gray-700">
                            앞면 확률 (P(H)): 
                            <span id="probabilityDisplay" class="font-bold text-indigo-600">50%</span>
                        </label>
                        <input 
                            type="range" 
                            id="probabilitySlider" 
                            min="0" 
                            max="100" 
                            value="50" 
                            oninput="updateProbability(this.value)"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer range-lg mt-2"
                        >
                    </div>
					<div class="pt-2 border-t pt-4 border-gray-200">
						<label for="speedSlider" class="block text-lg font-medium text-gray-700">
							자동 던지기 속도(ms): 
							<span id="speedDisplay" class="font-bold text-indigo-600">50</span>
						</label>
						<input 
							type="range" 
							id="speedSlider" 
							min="10" 
							max="1000" 
							step="10" 
							value="50" 
							oninput="updateFlipSpeed(this.value)"
							class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer range-lg mt-2"
						>
						<!-- 변경된 문구 -->
						<div class="flex justify-between text-xs text-gray-500 mt-1 px-1">
							<span>빠르게</span>
							<span>느리게</span>
						</div>
					</div>
                    <div id="coinContainer" class="flex flex-col items-center space-y-4 pt-4">
                        <div 
                            id="coin" 
                            onclick="handleCoinFlip()" 
                            class="coin-heads w-32 h-32 rounded-full flex items-center justify-center text-5xl font-extrabold text-gray-800 shadow-xl transition duration-150 ease-in-out hover:scale-[1.02]"
                            style="transform-style: preserve-3d;"
                        >?</div>
                        <p id="flipResultText" class="text-center text-xl font-bold h-8 text-gray-700">결과: -</p>
                    </div>
                    <button id="autoFlipButton" onclick="toggleAutoFlip()" class="flip-button w-full py-3 bg-green-500 text-white font-medium rounded-xl hover:bg-green-600 mt-4">
                        자동 던지기 시작
                    </button>
                    <button onclick="flip100Times()" class="flip-button w-full py-3 bg-purple-500 text-white font-medium rounded-xl hover:bg-purple-600 mt-2">
                        100번 던지기
                    </button>
                    <button onclick="resetSimulation()" class="flip-button w-full py-3 bg-gray-400 text-white font-medium rounded-xl hover:bg-gray-500">
                        초기화
                    </button>
                </div>
                <div class="card bg-white p-6 rounded-3xl space-y-4">
                    <h2 class="text-2xl font-semibold text-gray-700">통계</h2>
                    <div class="text-xl">
                        <p class="text-gray-600 font-medium">총 시행 횟수:</p>
                        <p id="totalFlips" class="text-4xl font-bold text-indigo-600">0</p>
                    </div>
                    <div class="space-y-2 pt-2">
                        <div class="flex justify-between items-center">
                            <span class="text-lg font-medium text-blue-600">앞면 (Heads)</span>
                            <span id="headsCount" class="text-2xl font-bold text-blue-600">0</span>
                        </div>
                        <div class="bg-gray-200 rounded-full h-2.5">
                            <div id="headsIndicator" class="indicator bg-blue-500" style="width: 0%;"></div>
                        </div>
                        <p id="headsRatio" class="text-right text-sm text-gray-500">0.00%</p>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-lg font-medium text-red-600">뒷면 (Tails)</span>
                            <span id="tailsCount" class="text-2xl font-bold text-red-600">0</span>
                        </div>
                        <div class="bg-gray-200 rounded-full h-2.5">
                            <div id="tailsIndicator" class="indicator bg-red-500" style="width: 0%;"></div>
                        </div>
                        <p id="tailsRatio" class="text-right text-sm text-gray-500">0.00%</p>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-2 card bg-white p-6 rounded-3xl">
                <h2 class="text-2xl font-semibold text-gray-700 mb-4 text-center">현재 비율 (원 그래프)</h2>
                <div class="flex justify-center items-center">
                    <canvas id="chartCanvas" width="400" height="400" class="max-w-xs md:max-w-md"></canvas>
                </div>
                <p id="convergenceMessage" class="mt-4 text-center text-lg font-medium text-gray-600"></p>
            </div>
        </div>
    </div>

    <script>
        let headsCount = 0, tailsCount = 0, totalFlips = 0, isAutoFlipping = false, isFlipping = false, autoFlipInterval, flipSpeed = 50;
        let probabilityHeads = 0.5;

        const $totalFlips = document.getElementById('totalFlips');
        const $headsCount = document.getElementById('headsCount');
        const $tailsCount = document.getElementById('tailsCount');
        const $headsRatio = document.getElementById('headsRatio');
        const $tailsRatio = document.getElementById('tailsRatio');
        const $headsIndicator = document.getElementById('headsIndicator');
        const $tailsIndicator = document.getElementById('tailsIndicator');
        const $autoFlipButton = document.getElementById('autoFlipButton');
        const $convergenceMessage = document.getElementById('convergenceMessage');
        const $coin = document.getElementById('coin');
        const $flipResultText = document.getElementById('flipResultText');
        const $probabilityDisplay = document.getElementById('probabilityDisplay'); 
        const $speedDisplay = document.getElementById('speedDisplay'); 
        const $speedSlider = document.getElementById('speedSlider');

        let canvas, ctx, center, radius;

        function updateProbability(value) {
            probabilityHeads = parseInt(value) / 100;
            $probabilityDisplay.textContent = `${value}%`;
            updateConvergenceMessage((headsCount / totalFlips) * 100); 
            drawChart(); 
        }

        function updateFlipSpeed(value) {
            let speed = parseInt(value);
            if (isNaN(speed) || speed < 10) speed = 10;
            else if (speed > 1000) speed = 1000;

            flipSpeed = speed;
            $speedDisplay.textContent = `${flipSpeed}`;
            $speedSlider.value = flipSpeed;

            if (isAutoFlipping) {
                clearInterval(autoFlipInterval);
                autoFlipInterval = setInterval(autoFlipStep, flipSpeed);
            }
        }

        async function flip100Times() {
            if (isFlipping || isAutoFlipping) return; // 이미 던지는 중이면 무시
            isFlipping = true;

            for (let i = 0; i < 100; i++) {
                const result = Math.random() < probabilityHeads ? 'H' : 'T';

                $coin.textContent = '?';
                $coin.style.transform = 'rotateY(0deg)';
                $coin.style.animation = 'flipCoin 0.7s cubic-bezier(0.4,0,0.6,1) forwards';
                $coin.classList.remove('coin-heads', 'coin-tails'); 
                $flipResultText.textContent = `던지는 중... (${i+1}/100)`;

                // flipSpeed를 딜레이로 사용
                await new Promise(resolve => setTimeout(resolve, flipSpeed));

                $coin.style.transform = 'rotateY(1080deg)';
                $coin.style.animation = 'none';
                if (result === 'H') {
                    $coin.textContent = '앞';
                    $coin.classList.add('coin-heads');
                    $coin.classList.remove('coin-tails'); 
                } else {
                    $coin.textContent = '뒤';
                    $coin.classList.add('coin-tails');
                    $coin.classList.remove('coin-heads'); 
                }

                flipCoinNonAnimated(result); // 통계 업데이트
            }

            $flipResultText.textContent = '100번 던지기 완료';
            isFlipping = false;
        }



        function initializeCanvas() {
            canvas = document.getElementById('chartCanvas');
            ctx = canvas.getContext('2d');
            const chartContainer = canvas.parentElement;
            const size = Math.min(chartContainer.offsetWidth, 400);
            canvas.width = size;
            canvas.height = size;
            center = canvas.width / 2;
            radius = canvas.width / 2 - 20;
        }

        function flipCoinNonAnimated(result) {
            if (result === 'H') headsCount++; else tailsCount++;
            totalFlips++;
            updateDisplay();
            drawChart();
        }

        function handleCoinFlip() {
            if (isAutoFlipping || isFlipping) return;
            isFlipping = true;
            const result = Math.random() < probabilityHeads ? 'H' : 'T';
            $coin.textContent = '?';
            $coin.style.transform = 'rotateY(0deg)';
            $coin.style.animation = 'flipCoin 0.7s cubic-bezier(0.4,0,0.6,1) forwards';
            $flipResultText.textContent = '던지는 중...';
            $coin.classList.remove('coin-heads', 'coin-tails'); 
            setTimeout(() => {
                $coin.style.transform = 'rotateY(1080deg)';
                $coin.style.animation = 'none';
                if (result === 'H') {
                    $coin.textContent = '앞';
                    $coin.classList.add('coin-heads');
                    $coin.classList.remove('coin-tails'); 
                } else {
                    $coin.textContent = '뒤';
                    $coin.classList.add('coin-tails');
                    $coin.classList.remove('coin-heads'); 
                }
                flipCoinNonAnimated(result);
                $flipResultText.textContent = `결과: ${result === 'H' ? '앞면' : '뒷면'}`;
                isFlipping = false;
            }, 700);
        }

        function updateDisplay() {
            $totalFlips.textContent = totalFlips.toLocaleString();
            $headsCount.textContent = headsCount.toLocaleString();
            $tailsCount.textContent = tailsCount.toLocaleString();

            if (totalFlips === 0) {
                $headsRatio.textContent = '0.00%';
                $tailsRatio.textContent = '0.00%';
                $headsIndicator.style.width = '0%';
                $tailsIndicator.style.width = '0%';
                $convergenceMessage.textContent = '동전을 던져 시뮬레이션을 시작하세요.';
                $coin.textContent = '?';
                $coin.classList.add('coin-heads');
                $coin.classList.remove('coin-tails');
                return;
            }

            const headsRatio = (headsCount / totalFlips) * 100;
            const tailsRatio = (tailsCount / totalFlips) * 100;
            $headsRatio.textContent = `${headsRatio.toFixed(2)}%`;
            $tailsRatio.textContent = `${tailsRatio.toFixed(2)}%`;
            $headsIndicator.style.width = `${headsRatio}%`;
            $tailsIndicator.style.width = `${tailsRatio}%`;
            updateConvergenceMessage(headsRatio);
        }

        function drawChart() {
            if (!ctx || !canvas) return; 
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (totalFlips === 0) {
                ctx.beginPath();
                ctx.arc(center, center, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#e5e7eb';
                ctx.fill();
                ctx.closePath();
                ctx.fillStyle = '#6b7280';
                ctx.font = '20px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('0회 시행', center, center);
                return;
            }

            const headsRatio = headsCount / totalFlips;
            const headsAngle = 2 * Math.PI * headsRatio;

            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.closePath();

            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, 0, headsAngle); 
            ctx.fillStyle = '#3b82f6';
            ctx.fill();
            ctx.closePath();

            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.lineTo(center + radius * Math.cos(headsAngle), center + radius * Math.sin(headsAngle));
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();

            const targetRatioPercent = (probabilityHeads * 100).toFixed(0);
            const ratioDiff = Math.abs(headsRatio * 100 - targetRatioPercent);
            ctx.fillStyle = '#1f2937';
            ctx.font = 'bold 20px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`P(H): ${targetRatioPercent}%`, center, center - 25);
            const dominanceText = headsCount > tailsCount ? '앞면 우세' : (tailsCount > headsCount ? '뒷면 우세' : '동률');
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.fillText(dominanceText, center, center + 10);
            ctx.font = '16px Inter, sans-serif';
            ctx.fillText(`목표 대비 차이: ${ratioDiff.toFixed(2)}%`, center, center + 40);
        }

        function updateConvergenceMessage(headsRatio) {
            const targetRatio = probabilityHeads * 100;
            const diff = Math.abs(headsRatio - targetRatio);
            const total = totalFlips.toLocaleString();

            if (totalFlips < 100) {
                $convergenceMessage.className = 'mt-4 text-center text-lg font-medium text-gray-600';
                $convergenceMessage.textContent = `시행 횟수(${total}회)가 적어 편차가 클 수 있습니다. 더 던져보세요!`;
            } else if (diff < 1) {
                $convergenceMessage.className = 'mt-4 text-center text-lg font-bold text-green-600 animate-pulse';
                $convergenceMessage.textContent = `⭐ 확률 수렴 중! (${total}회) 현재 비율이 설정된 ${targetRatio.toFixed(0)}%에 아주 가깝습니다!`;
            } else if (diff < 5) {
                $convergenceMessage.className = 'mt-4 text-center text-lg font-semibold text-amber-600';
                $convergenceMessage.textContent = `균형을 찾아가고 있습니다! (${total}회)`;
            } else {
                $convergenceMessage.className = 'mt-4 text-center text-lg font-medium text-gray-600';
                $convergenceMessage.textContent = `시행 횟수를 늘려가면 설정된 ${targetRatio.toFixed(0)}%에 가까워질 것입니다.`;
            }
        }

        function autoFlipStep() {
            const result = Math.random() < probabilityHeads ? 'H' : 'T';
            flipCoinNonAnimated(result);
            $flipResultText.textContent = '자동 던지기 중...';
        }

        function toggleAutoFlip() {
            if (isAutoFlipping) {
                clearInterval(autoFlipInterval);
                $autoFlipButton.textContent = '자동 던지기 시작';
                $autoFlipButton.classList.remove('bg-red-500', 'hover:bg-red-600');
                $autoFlipButton.classList.add('bg-green-500', 'hover:bg-green-600');
                const lastResult = totalFlips > 0 ? (headsCount > tailsCount ? '앞면 우세' : '뒷면 우세') : '-';
                $flipResultText.textContent = `결과: ${lastResult}`;
            } else {
                autoFlipInterval = setInterval(autoFlipStep, flipSpeed);
                $autoFlipButton.textContent = '자동 던지기 중지';
                $autoFlipButton.classList.remove('bg-green-500', 'hover:bg-green-600');
                $autoFlipButton.classList.add('bg-red-500', 'hover:bg-red-600');
            }
            isAutoFlipping = !isAutoFlipping;
        }

        function resetSimulation() {
            clearInterval(autoFlipInterval);
            isAutoFlipping = false;
            headsCount = 0; tailsCount = 0; totalFlips = 0;
            updateDisplay();
            drawChart();
            $autoFlipButton.textContent = '자동 던지기 시작';
            $autoFlipButton.classList.remove('bg-red-500', 'hover:bg-red-600');
            $autoFlipButton.classList.add('bg-green-500', 'hover:bg-green-600');
        }

        window.onload = function() {
            initializeCanvas();
            updateProbability(document.getElementById('probabilitySlider').value);
            updateFlipSpeed($speedSlider.value);
            updateDisplay();
            drawChart();
        }
        window.addEventListener('resize', initializeCanvas);
    </script>
</body>
</html>
