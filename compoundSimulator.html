<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 거듭제곱의 비밀</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; }
  button { transition: 0.2s; }
</style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

<div class="w-full max-w-3xl space-y-6">

  <!-- 헤더 -->
  <header class="text-center">
    <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800">💰 거듭제곱의 비밀</h1>
    <p class="text-gray-500 mt-2 md:mt-1 text-sm md:text-base">시드머니와 수익률(비)을 입력하고 시간에 따른 성장 그래프를 확인하세요.</p>
  </header>

  <!-- 입력폼 카드 -->
  <div class="bg-white p-6 rounded-3xl shadow-md space-y-4">
    
    <!-- 시드머니 -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-2">
      <label class="font-medium text-gray-700">🌱 시드머니:</label>
      <div class="flex items-center gap-2 w-full md:w-40">
        <input id="seed" type="number" value="10000" class="w-full p-2 rounded-xl border border-gray-300 text-right text-gray-700">
        <span>원</span>
      </div>
    </div>

    <!-- 수익 단위 -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-2">
      <span class="font-medium text-gray-700">단위:</span>
      <div class="flex gap-4">
        <label class="flex items-center gap-1"><input type="radio" name="rateMode" value="percent" checked> 수익률(%)</label>
        <label class="flex items-center gap-1"><input type="radio" name="rateMode" value="ratio"> 수익비(배)</label>
      </div>
    </div>

    <!-- 고정 수익률 -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-2">
      <label class="font-medium text-gray-700">고정 수익률(비):</label>
      <div class="flex items-center gap-2 w-full md:w-40">
        <input id="rate" type="number" value="100" step="0.1" class="w-full p-2 rounded-xl border border-gray-300 text-right text-gray-700">
        <span id="rateUnitLabel">%</span>
      </div>
    </div>

    <!-- 투자 기간/단위 -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-2">
      <div class="flex items-center gap-2">
        <label class="font-medium text-gray-700">투자 기간:</label>
        <select id="count" class="p-2 rounded-xl border border-gray-300 text-gray-700"></select>
      </div>
      <div class="flex items-center gap-2">
        <label class="font-medium text-gray-700">단위:</label>
        <select id="unit" class="p-2 rounded-xl border border-gray-300 text-gray-700">
          <option value="day">일</option>
          <option value="month">월</option>
          <option value="year" selected>년</option>
        </select>
      </div>
    </div>

    <!-- 계산 방식 선택 -->
    <div class="flex justify-center gap-6 mt-2">
      <label class="flex items-center gap-1"><input type="radio" name="calcType" value="compound" checked> 복리</label>
      <label class="flex items-center gap-1"><input type="radio" name="calcType" value="simple"> 단리</label>
      <label class="flex items-center gap-1"><input type="radio" name="calcType" value="both"> 복리+단리</label>
    </div>

    <!-- 그래프 타입 -->
    <div class="flex justify-center gap-6 mt-2">
      <label class="flex items-center gap-1"><input type="radio" name="chartType" value="line" checked> 선그래프</label>
      <label class="flex items-center gap-1"><input type="radio" name="chartType" value="bar"> 막대그래프</label>
    </div>

    <!-- 조회 버튼 -->
    <button id="generate" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl mt-4">🔍 조회하기</button>

  </div>

  <!-- 차트 카드 -->
  <div class="bg-white p-6 rounded-3xl shadow-md">
    <canvas id="growthChart" class="w-full h-64 md:h-80"></canvas>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  // 표시 개수 select box 채우기
  const countSelect = document.getElementById("count");
  for (let i = 1; i <= 30; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = i;
    countSelect.appendChild(opt);
  }
  countSelect.value = 10;

  let chart;

  function calculateCompound(seed, rate, rateMode, unit, count, calcType) {
    const labels = [];
    const data = [];
    const dataSimple = []; // 단리용
    let total = seed;
    let totalSimple = seed;
    const unitText = unit === "day" ? "일" : unit === "month" ? "개월" : "년";

    labels.push(`0${unitText}`);
    if(calcType === "both") {
      data.push({compound: Math.round(total), simple: Math.round(total)});
    }else {
      data.push(Math.round(total));
    }
    
    dataSimple.push(Math.round(totalSimple));
    const appliedRate = (rateMode === "percent") ? (1 + rate / 100) : rate;

    for (let i = 1; i <= count; i++) {
      if (calcType === "compound") {
        total *= appliedRate; // 복리
        data.push(Math.round(total));
      } else if (calcType === "simple") {
        totalSimple += seed * (appliedRate - 1); // 단리
        data.push(Math.round(totalSimple));
      } else if (calcType === "both") {
        total *= appliedRate; // 복리
        totalSimple += seed * (appliedRate - 1); // 단리
        data.push({ compound: Math.round(total), simple: Math.round(totalSimple) });
      }
      console.log("data: " + data);
      labels.push(`${i}${unitText}`);
    }

    return { labels, data };
  }

  function drawChart() {
    const seed = parseFloat(document.getElementById("seed").value);
    const rate = parseFloat(document.getElementById("rate").value);
    const rateMode = document.querySelector('input[name="rateMode"]:checked').value;
    const unit = document.getElementById("unit").value;
    const count = parseInt(document.getElementById("count").value);
    const calcType = document.querySelector('input[name="calcType"]:checked').value;
    const chartType = document.querySelector('input[name="chartType"]:checked').value;

    if (isNaN(seed) || isNaN(rate)) {
      alert("시드머니와 수익률을 정확히 입력해주세요!");
      return;
    }

    const { labels, data } = calculateCompound(seed, rate, rateMode, unit, count, calcType);
    const ctx = document.getElementById("growthChart").getContext("2d");

    const chartOptions = {
      plugins: {
        tooltip: { enabled: true, callbacks: { label: (ctx) => `${ctx.parsed.y.toLocaleString()} 원` } }
      },
      scales: {
        x: { title: { display: true, text: "기간" }},
        y: { 
          title: { display: true, text: "금액(원)" },
          beginAtZero: true // Y축 최소값 0
        }
      }
    };

    if(chart) chart.destroy();

    if(calcType === "both") {
      chart = new Chart(ctx, {
        type: chartType,
        data: {
          labels,
          datasets: [
            { label: "🌱복리", data: data.map(d => d.compound), borderColor: "#4caf50", backgroundColor: "rgba(76,175,80,0.2)", fill: true, tension: 0.3, pointRadius: 5, pointBackgroundColor: "#81c784" },
            { label: "🌱단리", data: data.map(d => d.simple), borderColor: "#2196f3", backgroundColor: "rgba(33,150,243,0.2)", fill: true, tension: 0.3, pointRadius: 5, pointBackgroundColor: "#64b5f6" }
          ]
        },
        options: chartOptions
      });
    } else {
      chart = new Chart(ctx, {
        type: chartType,
        data: { labels, datasets: [{ label: "🌱금액", data, borderColor: "#4caf50", backgroundColor: "rgba(76,175,80,0.2)", fill: true, tension: 0.3, pointRadius: 5, pointBackgroundColor: "#81c784" }] },
        options: chartOptions
      });
    }
  }

document.querySelectorAll('input[name="rateMode"]').forEach(radio => {
  radio.addEventListener("change", (e) => {
    const label = document.getElementById("rateUnitLabel");
    const rateInput = document.getElementById("rate");
    let value = parseFloat(rateInput.value);
    if (isNaN(value)) value = 0;

    if (e.target.value === "percent") { 
      // 배 → %
      rateInput.value = ((value - 1) * 100).toFixed(2);
      label.textContent = "%"; 
    } else { 
      // % → 배
      rateInput.value = (1 + value / 100).toFixed(2);
      label.textContent = "배"; 
    }
  });
});

  document.getElementById("generate").addEventListener("click", drawChart);
</script>
</body>
</html>
